# Clay (dark): neutral surfaces and syntax, terracotta interaction focus.
# Values follow clay.nvim's design/clay-design-system.md dark palette.
# Canonical Omarchy semantic names; app configs are generated at theme-set time.
mode = "dark"

accent = "#d97757"
selection = "#363636"
selection_background = "#363636"
selection_foreground = "#e6e6e6"
muted = "#7a7a7a"

background = "#121212"
dark_background = "#101010"
darker_background = "#101010"
lighter_background = "#1a1a1a"

foreground = "#cccccc"
dark_foreground = "#8e8e8e"
light_foreground = "#aaaaaa"
bright_foreground = "#e6e6e6"

hyprland_active_border = "rgb(d97757)"
hyprland_inactive_border = "rgb(2a2a2a)"
active_border_color = "#d97757"
active_tab_background = "#d97757"

# ANSI slots follow the design's terminal table: grayscale except red, which is
# Clay so errors and diff removals stand apart from default text.
red = "#d97757"
green = "#e6e6e6"
yellow = "#aaaaaa"
blue = "#aaaaaa"
magenta = "#8e8e8e"
cyan = "#aaaaaa"
orange = "#8e8e8e"
brown = "#7a7a7a"

bright_red = "#d97757"
bright_green = "#e6e6e6"
bright_yellow = "#cccccc"
bright_blue = "#cccccc"
bright_magenta = "#aaaaaa"
bright_cyan = "#cccccc"
