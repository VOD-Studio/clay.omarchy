<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>Clay Horizon</title>
  <desc>An original near-black landscape of nested, softly rising mineral contours, with a single restrained clay-colored seam. The central ridge remains visible in a portrait crop.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="2160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111315"/>
      <stop offset="0.55" stop-color="#111315"/>
      <stop offset="1" stop-color="#151719"/>
    </linearGradient>
    <linearGradient id="stone" x1="1920" y1="990" x2="1920" y2="2290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1e20"/>
      <stop offset="0.68" stop-color="#17191b"/>
      <stop offset="1" stop-color="#141618"/>
    </linearGradient>
    <linearGradient id="edge" x1="1080" y1="1600" x2="3030" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a2a" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#444444" stop-opacity="0.48"/>
      <stop offset="0.62" stop-color="#444444" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#2a2a2a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foreground" x1="0" y1="1770" x2="0" y2="2160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111315"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#canvas)"/>

  <!-- Broad, asymmetric strata: no texture filters or embedded raster imagery. -->
  <path d="M 830,2290 C 1080,2030 1185,1640 1465,1320 C 1650,1108 1820,990 2010,990 C 2250,990 2410,1155 2570,1370 C 2800,1680 2970,2040 3300,2290 Z" fill="url(#stone)"/>
  <path d="M 830,2290 C 1080,2030 1185,1640 1465,1320 C 1650,1108 1820,990 2010,990 C 2250,990 2410,1155 2570,1370 C 2800,1680 2970,2040 3300,2290" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <g fill="none" stroke="#2a2a2a" stroke-width="2">
    <path d="M 1030,2290 C 1230,2050 1345,1720 1570,1440 C 1730,1240 1865,1130 2020,1130 C 2220,1130 2360,1295 2505,1490 C 2700,1755 2850,2070 3120,2290" stroke-opacity="0.84"/>
    <path d="M 1220,2290 C 1390,2070 1485,1795 1670,1560 C 1800,1395 1910,1270 2030,1270 C 2195,1270 2320,1435 2450,1610 C 2610,1825 2735,2100 2940,2290" stroke-opacity="0.75"/>
    <path d="M 1410,2290 C 1545,2100 1635,1870 1775,1680 C 1880,1540 1950,1410 2040,1410 C 2170,1410 2280,1575 2390,1730 C 2520,1915 2625,2130 2760,2290" stroke-opacity="0.66"/>
    <path d="M 1600,2290 C 1710,2120 1780,1950 1880,1800 C 1950,1690 1995,1550 2050,1550 C 2145,1550 2240,1720 2330,1850 C 2425,1990 2510,2160 2580,2290" stroke-opacity="0.57"/>
  </g>

  <!-- A short exposed seam is the only chromatic mark. -->
  <path d="M 1904,1002 C 1940,994 1975,990 2010,990 C 2048,990 2084,994 2118,1002" fill="none" stroke="#d97757" stroke-width="3" stroke-linecap="round" opacity="0.76"/>

  <!-- A quiet foreground horizon lets the ridge recede below the desktop. -->
  <path d="M 0,1835 C 525,1792 1005,1873 1490,1918 C 2055,1970 2590,1926 3070,1865 C 3360,1828 3615,1818 3840,1846 L 3840,2160 L 0,2160 Z" fill="url(#foreground)"/>
  <path d="M 0,1835 C 525,1792 1005,1873 1490,1918 C 2055,1970 2590,1926 3070,1865 C 3360,1828 3615,1818 3840,1846" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-opacity="0.62"/>
</svg>
