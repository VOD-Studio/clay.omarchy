# A section override, not a replacement for the full generated shell theme.
[controls]
normal-color = "#cccccc"
normal-fill-alpha = 0.04
normal-border = "#cccccc"
normal-border-width = 1
normal-border-alpha = 0.4

hover-cursor-color = "#dddddd"
hover-cursor-fill-alpha = 0.08
hover-cursor-border = "#aaaaaa"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25

focus-color = "#d97757"
focus-fill-alpha = 0.08
focus-border = "#d97757"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color = "#d97757"
selected-fill-alpha = 0.14
selected-border = "#d97757"
selected-border-width = 1
selected-border-alpha = 0.4

pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35
